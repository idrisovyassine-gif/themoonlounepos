<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer mon restaurant | Servio</title><link rel="stylesheet" href="/portal.css"></head><body><main class="shell" style="max-width:880px"><header class="top"><div class="brand"><p class="eyebrow">Démarrage en quelques minutes</p><h1>Créer votre espace Servio</h1><p class="muted">Votre compte propriétaire et votre restaurant sont créés ensemble.</p></div><a class="btn secondary" href="/login">Connexion</a></header><div id="notice"></div>
<form id="signup" class="panel"><h2>1. Votre compte</h2><div class="form-grid"><div class="field"><label>Prénom</label><input name="firstName" required></div><div class="field"><label>Nom</label><input name="lastName" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Téléphone</label><input name="phone" type="tel"></div><div class="field"><label>Mot de passe (10 caractères min.)</label><input name="password" type="password" minlength="10" required></div><div class="field"><label>Confirmation</label><input name="confirm" type="password" required></div></div><h2 style="margin-top:28px">2. Votre restaurant</h2><div class="form-grid"><div class="field"><label>Nom du restaurant</label><input name="restaurantName" required></div><div class="field"><label>Email établissement</label><input name="restaurantEmail" type="email"></div><div class="field wide"><label>Adresse</label><input name="address"></div><div class="field"><label>Ville</label><input name="city"></div><div class="field"><label>Code postal</label><input name="postalCode"></div><div class="field"><label>Pays</label><input name="country" value="BE" maxlength="2"></div><div class="field"><label>Téléphone établissement</label><input name="restaurantPhone"></div><div class="field"><label>TVA (optionnel)</label><input name="vatNumber"></div><div class="field"><label>Devise</label><select name="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select></div><div class="field"><label>Fuseau horaire</label><input name="timezone" value="Europe/Brussels"></div><div class="field"><label>Langue</label><select name="language"><option value="fr">Français</option><option value="nl">Nederlands</option><option value="en">English</option></select></div></div><div style="margin-top:20px"><button class="btn" type="submit">Créer mon restaurant</button></div></form></main><script>
const form=document.getElementById('signup'),notice=document.getElementById('notice');form.addEventListener('submit',async e=>{e.preventDefault();notice.innerHTML='';const data=Object.fromEntries(new FormData(form));if(data.password!==data.confirm){notice.innerHTML='<div class="notice error">Les mots de passe ne correspondent pas.</div>';return}delete data.confirm;const response=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok){notice.innerHTML=`<div class="notice error">${result.error||'Inscription impossible'}</div>`;return}location.replace(result.next||'/dashboard?onboarding=1')});
</script></body></html>
