<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuisine | Servio</title><link rel="stylesheet" href="/portal.css"><style>.kitchen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.kitchen-card{border:2px solid var(--line);border-radius:16px;padding:17px;background:#0d192a}.kitchen-card.IN_PROGRESS{border-color:#e7a82d}.kitchen-card.READY{border-color:var(--ok)}.kitchen-card h2{margin:5px 0}.kitchen-lines{list-style:none;padding:0;margin:15px 0}.kitchen-lines li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}.age{font-variant-numeric:tabular-nums}</style></head><body><main class="shell"><header class="top"><div class="brand"><p class="eyebrow">Production</p><h1 id="title">Cuisine</h1><p id="updated" class="muted"></p></div><div class="actions"><a class="btn secondary" href="/">POS</a><button id="refresh" class="btn">Actualiser</button><button id="logout" class="btn secondary">Déconnexion</button></div></header><div id="notice"></div><nav class="tabs"><button class="tab active" data-filter="ALL">Toutes</button><button class="tab" data-filter="IN_PROGRESS">En préparation</button><button class="tab" data-filter="READY">Prêtes</button></nav><section id="orders" class="kitchen-grid"></section></main><script src="/kitchen.js" defer></script></body></html>
