<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connexion | Servio POS</title>
  <style>
    :root {
      --bg: #09111d;
      --panel: rgba(15, 23, 38, 0.92);
      --panel-border: rgba(122, 145, 185, 0.18);
      --text: #f6f8fb;
      --muted: #92a6c8;
      --accent: #f2b43b;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans", "Arial Unicode MS", "DejaVu Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(31, 138, 238, 0.18), transparent 36%),
        radial-gradient(circle at bottom, rgba(242, 180, 59, 0.16), transparent 34%),
        linear-gradient(160deg, #060b14 0%, #0d1729 48%, #08101d 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-shell {
      width: min(460px, 100%);
      border-radius: 24px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 10px 0;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
    }

    .subtitle {
      margin: 12px 0 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    form {
      margin-top: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    input, select {
      width: 100%;
      border: 1px solid rgba(146, 166, 200, 0.24);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    input:focus {
      border-color: rgba(31, 138, 238, 0.9);
      box-shadow: 0 0 0 4px rgba(31, 138, 238, 0.15);
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: #0b1120;
      background: linear-gradient(135deg, var(--accent), #f6d06f);
      box-shadow: 0 16px 40px rgba(242, 180, 59, 0.28);
    }

    .hint {
      margin: 14px 0 0 0;
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .hint.error {
      color: var(--danger);
    }

    .pin-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(146, 166, 200, 0.14);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .tabs { display:flex; gap:8px; margin-top:22px; }
    .tabs button { margin:0; padding:11px; background:rgba(255,255,255,.08); color:var(--text); box-shadow:none; }
    .tabs button.active { background:linear-gradient(135deg,var(--accent),#f6d06f); color:#0b1120; }
    .hidden { display:none; }
    .signup-link { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <section class="login-shell">
    <p class="eyebrow">POS multi-restaurants</p>
    <h1>Servio</h1>
    <p class="subtitle">Connectez votre compte de gestion ou ouvrez une session employé par PIN.</p>

    <div class="tabs"><button id="account-tab" class="active" type="button">Compte</button><button id="pin-tab" type="button">PIN employé</button></div>

    <form id="account-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
    <form id="pin-form" class="hidden">
      <label for="restaurant">Restaurant (nom ou identifiant)</label>
      <input id="restaurant" name="restaurant" type="text" autocomplete="organization" required>
      <label for="name">Nom</label>
      <input id="name" name="name" type="text" autocomplete="username" required>
      <label for="pin">Code PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit">Entrer</button>
    </form>
    <p id="login-hint" class="hint"></p>

    <div class="pin-note">Nouveau restaurant ? <a class="signup-link" href="/signup">Créer un compte</a></div>
  </section>

  <script>
    const accountForm = document.getElementById("account-form");
    const pinForm = document.getElementById("pin-form");
    const hint = document.getElementById("login-hint");

    const setHint = (message, isError) => {
      hint.textContent = message || "";
      hint.className = isError ? "hint error" : "hint";
    };

    const switchMode = (pin) => {
      accountForm.classList.toggle("hidden", pin); pinForm.classList.toggle("hidden", !pin);
      document.getElementById("account-tab").classList.toggle("active", !pin); document.getElementById("pin-tab").classList.toggle("active", pin);
      setHint("", false);
    };
    document.getElementById("account-tab").addEventListener("click", () => switchMode(false));
    document.getElementById("pin-tab").addEventListener("click", () => switchMode(true));

    const login = async (event, payload) => {
      event.preventDefault();
      setHint("Verification...", false);

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });

        if (!res.ok) {
          setHint("Nom ou code PIN incorrect.", true);
          return;
        }

        const data = await res.json();
        window.location.replace(data.next || "/");
      } catch (error) {
        setHint("Impossible de contacter le serveur.", true);
      }
    };
    accountForm.addEventListener("submit", (event) => login(event, () => ({ email: document.getElementById("email").value, password: document.getElementById("password").value })));
    pinForm.addEventListener("submit", (event) => login(event, () => ({ restaurant: document.getElementById("restaurant").value, name: document.getElementById("name").value, pin: document.getElementById("pin").value })));
  </script>
</body>
</html>
