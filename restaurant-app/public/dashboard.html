<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion | Servio</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main class="shell">
<header class="top">
<div class="brand">
<p class="eyebrow">Espace restaurant</p>
<h1 id="title">Servio</h1>
<p id="user" class="muted">
</p>
</div>
<div class="actions">
<a class="btn" href="/">Ouvrir le POS</a>
<button id="logout" class="btn secondary">Déconnexion</button>
</div>
</header>
<div id="notice">
</div>
<nav class="tabs">
<button class="tab active" data-page="overview">Tableau de bord</button>
<button class="tab" data-page="menu">Menu</button>
<button class="tab" data-page="staff">Personnel</button>
<button class="tab" data-page="tables">Tables</button>
<button class="tab" data-page="settings">Paramètres</button>
</nav>
<section id="overview" class="page">
<div class="panel">
<div class="actions">
<a class="btn secondary small" href="/kitchen">Écran cuisine</a>
<button class="btn small period" data-days="1">Aujourd’hui</button>
<button class="btn secondary small period" data-days="7">7 jours</button>
<button class="btn secondary small period" data-days="30">30 jours</button>
</div>
<div id="metrics" class="grid" style="margin-top:16px">
</div>
</div>
<div class="panel">
<h2>Produits les plus vendus</h2>
<div id="top-products" class="list">
</div>
</div>
</section>
<section id="menu" class="page hidden">
<div class="grid">
<form id="category-form" class="panel">
<h2>Nouvelle catégorie</h2>
<div class="field">
<label>Nom</label>
<input name="name" required>
</div>
<div class="field">
<label>Couleur</label>
<input name="color" type="color" value="#268cff">
</div>
<button class="btn" type="submit" style="margin-top:14px">Ajouter</button>
</form>
<form id="product-form" class="panel">
<h2>Nouveau produit</h2>
<div class="form-grid">
<div class="field">
<label>Nom</label>
<input name="name" required>
</div>
<div class="field">
<label>Catégorie</label>
<select name="categoryId" id="product-category" required>
</select>
</div>
<div class="field">
<label>Prix</label>
<input name="price" type="number" min="0" step=".01" required>
</div>
<div class="field">
<label>Description</label>
<input name="description">
</div>
</div>
<button class="btn" type="submit" style="margin-top:14px">Ajouter</button>
</form>
</div>
<form id="option-form" class="panel">
<h2>Options et suppléments</h2>
<div class="form-grid">
<div class="field"><label>Produit</label><select name="productId" id="option-product" required></select></div>
<div class="field"><label>Nom du groupe</label><input name="groupName" placeholder="Cuisson" required></div>
<div class="field wide"><label>Choix (un par ligne : Nom:prix)</label><textarea name="options" placeholder="Saignant:0&#10;À point:0&#10;Fromage:1"></textarea></div>
<div class="field"><label><input name="required" type="checkbox"> Choix obligatoire</label></div>
<div class="field"><label>Choix maximum</label><input name="maxChoices" type="number" min="1" value="1"></div>
</div>
<button class="btn" type="submit" style="margin-top:14px">Ajouter le groupe</button>
</form>
<div class="panel">
<h2>Catégories</h2>
<div id="categories" class="list">
</div>
</div>
<div class="panel">
<h2>Produits</h2>
<div id="products" class="list">
</div>
</div>
</section>
<section id="staff" class="page hidden">
<form id="employee-form" class="panel">
<h2>Ajouter un employé</h2>
<div class="form-grid">
<div class="field">
<label>Prénom</label>
<input name="firstName" required>
</div>
<div class="field">
<label>Nom</label>
<input name="lastName">
</div>
<div class="field">
<label>Email</label>
<input name="email" type="email">
</div>
<div class="field">
<label>Téléphone</label>
<input name="phone">
</div>
<div class="field">
<label>Rôle</label>
<select name="role">
<option>WAITER</option>
<option>CASHIER</option>
<option>KITCHEN</option>
<option>MANAGER</option>
</select>
</div>
<div class="field">
<label>PIN (4 à 12 chiffres)</label>
<input name="pin" inputmode="numeric" pattern="[0-9]{4,12}" required>
</div>
</div>
<button class="btn" type="submit" style="margin-top:14px">Ajouter</button>
</form>
<div class="panel">
<h2>Équipe</h2>
<div id="employees" class="list">
</div>
</div>
</section>
<section id="tables" class="page hidden">
<form id="table-form" class="panel">
<h2>Ajouter une table</h2>
<div class="form-grid">
<div class="field">
<label>Numéro</label>
<input name="number" type="number" min="1">
</div>
<div class="field">
<label>Nom</label>
<input name="name" placeholder="Terrasse 1">
</div>
<div class="field">
<label>Capacité</label>
<input name="capacity" type="number" min="1" value="4">
</div>
<div class="field">
<label>Zone</label>
<input name="area">
</div>
</div>
<button class="btn" type="submit" style="margin-top:14px">Ajouter</button>
</form>
<div class="panel">
<h2>Plan des tables</h2>
<div id="table-list" class="list">
</div>
</div>
</section>
<section id="settings" class="page hidden">
<form id="settings-form" class="panel">
<h2>Restaurant</h2>
<div class="form-grid">
<div class="field">
<label>Nom</label>
<input name="name" required>
</div>
<div class="field">
<label>Logo (URL)</label>
<input name="logoUrl">
</div>
<div class="field wide">
<label>Adresse</label>
<input name="address">
</div>
<div class="field">
<label>Ville</label>
<input name="city">
</div>
<div class="field">
<label>Code postal</label>
<input name="postalCode">
</div>
<div class="field">
<label>Pays</label>
<input name="country">
</div>
<div class="field">
<label>Téléphone</label>
<input name="phone">
</div>
<div class="field">
<label>Email</label>
<input name="email" type="email">
</div>
<div class="field">
<label>TVA</label>
<input name="vatNumber">
</div>
<div class="field">
<label>Devise</label>
<input name="currency">
</div>
<div class="field">
<label>Fuseau horaire</label>
<input name="timezone">
</div>
<div class="field">
<label>Langue</label>
<input name="language">
</div>
<div class="field">
<label>Taxe %</label>
<input name="taxRate" type="number" min="0" max="100" step=".01">
</div>
<div class="field">
<label>Frais de service %</label>
<input name="serviceChargeRate" type="number" min="0" max="100" step=".01">
</div>
<div class="field wide">
<label>Bas de ticket</label>
<textarea name="receiptFooter">
</textarea>
</div>
</div>
<button class="btn" type="submit" style="margin-top:14px">Enregistrer</button>
</form>
</section>
</main>
<script src="/dashboard.js" defer>
</script>
</body>
</html>
